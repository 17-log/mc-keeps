<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>麦味拾光 · 把小日子，慢慢收好</title><style>/*STYLE*/</style></head>
<body>
<div class="app-shell">
 <aside class="sidebar">
  <a class="brand" href="#calendar" aria-label="麦味拾光首页"><span class="brand-icon">m<span>✳</span></span><span><b>麦味拾光</b><small>little bites, lovely days</small></span></a>

  </nav>
  <div class="sidebar-note"><span class="note-star">✳</span><p>不必每天精彩，<br>每一页都算数。</p><small>A LITTLE MOMENT TO KEEP.</small></div>
  <div class="sidebar-bottom"><button id="space-btn" class="space-btn"><span class="space-dot"></span><span>示例手帐</span><span>⇄</span></button><button id="backup-btn" class="quiet-btn"><span data-icon="download"></span>备份我的记录</button><button id="restore-btn" class="quiet-btn"><span data-icon="upload"></span>恢复备份</button><input id="restore-input" type="file" accept="application/json,.json" hidden><small class="storage-note">保存在这个浏览器里</small></div>
 </aside>
 <main class="main-area">

  <div id="view-host" class="view-host"></div>

 </main>
</div>
<nav class="mobile-nav" aria-label="手机页面导航"><button aria-label="照片日历" data-view="calendar" class="active"><span data-icon="calendar"></span>日历</button><button aria-label="本月收藏" data-view="collection"><span data-icon="box"></span>收藏</button><button id="mobile-add" class="mobile-add" aria-label="记一餐"><span data-icon="plus"></span></button><button aria-label="年度书架" data-view="year"><span data-icon="book"></span>年册</button><button id="mobile-space"><span data-icon="user"></span>空间</button></nav>
