.km-tray {
  position: relative;
  height: 350px;
  min-height: 300px;
  overflow: hidden;
  isolation: isolate;
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 0, rgba(255,255,255,.8), transparent 72%),
    #f7f0e6;
  border: 1px solid rgba(116, 84, 58, .10);
  box-shadow: inset 0 2px 10px rgba(119, 91, 61, .025);
  -webkit-user-select: none;
  user-select: none;
}
.km-tray-decoration { position: absolute; inset: 0; pointer-events: none; color: #c2a88b; }
.km-tray-star { position: absolute; line-height: 1; opacity: .65; }
.km-tray-star-one { top: 30px; left: 28px; font-size: 22px; transform: rotate(12deg); }
.km-tray-star-two { top: 76px; right: 33px; font-size: 30px; transform: rotate(-9deg); }
.km-tray-word {
  position: absolute; top: 34px; left: 0; right: 0; text-align: center;
  font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-style: italic;
  letter-spacing: .3px; color: #b69d82;
}
.km-sticker {
  position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0;
  display: block; background: none; border-radius: 25%; cursor: grab;
  color: #5c4032; touch-action: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  transform-origin: 50% 50%; outline: none;
}
.km-sticker-art {
  position: relative; display: block; height: 100%; width: 100%;
  transition: scale .18s ease, filter .18s ease;
  filter: drop-shadow(0 1px 0 white) drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 -1px 0 white) drop-shadow(0 5px 3px rgba(77,48,24,.11));
}
.km-sticker img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  pointer-events: none; -webkit-user-drag: none;
}
.km-sticker-label {
  position: absolute; z-index: 5; left: 50%; bottom: -15px; transform: translate(-50%, 3px);
  max-width: 140px; width: max-content; padding: 5px 9px; border-radius: 8px;
  background: #fffdf9; border: 1px solid #e7dacb; box-shadow: 0 3px 10px #60432512;
  color: #665043; font-size: 11px; line-height: 1.4; font-family: inherit;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.km-sticker:hover .km-sticker-art { scale: 1.045; }
.km-sticker:hover .km-sticker-label,
.km-sticker:focus-visible .km-sticker-label { opacity: 1; transform: translate(-50%, 0); }
.km-sticker:focus-visible { outline: 2px dashed #a95d46; outline-offset: 3px; }
.km-sticker.km-dragging { cursor: grabbing; }
.km-sticker.km-dragging .km-sticker-art {
  scale: 1.075;
  filter: drop-shadow(0 1px 0 white) drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 -1px 0 white) drop-shadow(0 11px 7px rgba(77,48,24,.20));
}
.km-sticker.km-dragging .km-sticker-label { opacity: 0; }
.km-sticker.km-selected .km-sticker-art { animation: km-soft-pop .4s cubic-bezier(.2,.65,.3,1); }
.km-moving .km-sticker { will-change: transform; }
.km-reduced .km-sticker { cursor: pointer; touch-action: manipulation; }
.km-reduced .km-sticker-art { transition: none; }
.km-reduced .km-sticker.km-selected .km-sticker-art { animation: none; }
.km-empty {
  position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
  padding: 35px; font-size: 14px; color: #a08b76; text-align: center;
}
@keyframes km-soft-pop {
  0%,100% { scale: 1; }
  42% { scale: 1.12; }
  72% { scale: .97; }
}
@media (max-width: 600px) {
  .km-tray { height: 320px; border-radius: 20px; }
  .km-tray-word { top: 28px; font-size: 15px; }
  .km-tray-star-one { top: 27px; left: 21px; font-size: 17px; }
  .km-tray-star-two { top: 64px; right: 23px; font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .km-sticker-art, .km-sticker-label { transition: none; }
  .km-sticker.km-selected .km-sticker-art { animation: none; }
}

  --kp-paper: #fffdf6;

/* Landing: an illustrated paper invitation, with a little game inside it. */
.kp-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }

.kp-live-label { position: absolute; z-index: 2; right: -3px; top: 4px; border: 1px solid var(--kp-ink); padding: 5px 9px; background: #e1edcf; font: 9px/1.4 var(--kp-mono); color: #5c7252; box-shadow: 2px 2px 0 #b7be9f; transform: rotate(3deg); }

.kp-chips > :nth-child(2n) { background: #e9efdf; border-color: #d9e2cc; color: #738164; }
.kp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.kp-btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; min-height: 43px; padding: 10px 17px; border: 2px solid var(--kp-ink, #3b292f); border-radius: 2px; background: var(--kp-yellow, #f8cb5d); color: var(--kp-ink, #3b292f); box-shadow: 3px 3px 0 var(--kp-ink, #3b292f); text-decoration: none; font-size: 12px; font-weight: 650; line-height: 1.5; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; text-align: center; }

.kp-btn.plain, .kp-btn.kp-plain { background: var(--kp-paper, #fffdf6); border-color: #dfd4c2; color: #8c7967; box-shadow: none; font-weight: 500; }
.kp-btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--kp-ink, #3b292f); }

.kp-btn.plain:hover:not(:disabled), .kp-btn.kp-plain:hover:not(:disabled) { background: #f7efdf; box-shadow: none; }
.kp-btn:disabled, .kp-btn[aria-disabled='true'] { opacity: .45; cursor: default; transform: none; box-shadow: none; }

.kp-how { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; padding-top: 20px; color: #9b8c7b; font-size: 10px; }

.kp-friend-entry { display: flex; align-items: center; gap: 16px; padding: 17px 20px; margin: 0 0 30px; border: 1px solid #b7c8aa; background: #f8fbf1; box-shadow: 3px 3px 0 #e0e7d3; }

/* A small invitation lives on the existing calendar without changing its style. */
.kp-banner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 0 22px; min-height: 76px; max-height: 100px; border: 1px solid #e6d7c3; border-radius: 10px; background: #f5e8d7; }
.kp-banner-art { flex: 0 0 52px; width: 52px; }

/* Questions: clear choices and one short scene per page. */

.kp-answer:hover { background: #fff5e5; border-color: #cf8270; transform: translateX(2px); }
.kp-answer.selected, .kp-answer.is-selected, .kp-answer[aria-pressed='true'], .kp-answer[aria-checked='true'], .kp-answer[data-selected='true'] { background: #fff0be; border: 2px solid #b9804e; padding: 12px 14px; color: #65472f; }
.kp-answer-key { display: grid; place-items: center; width: 29px; height: 29px; flex: 0 0 29px; font: 12px/1 var(--kp-mono); border: 1px solid #decdb6; background: #f6eddf; color: #9b8167; }
.kp-answer.selected .kp-answer-key, .kp-answer.is-selected .kp-answer-key, .kp-answer[aria-pressed='true'] .kp-answer-key, .kp-answer[aria-checked='true'] .kp-answer-key { border-color: #b9804e; background: #f8cc6b; color: #6e4f2c; }
.kp-answer-text { min-width: 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }

.kp-quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding-top: 24px; margin-top: 25px; border-top: 1px dashed var(--kp-line); }

.kp-mini-orbit { position: relative; display: grid; place-items: center; min-height: 185px; }

/* Results: a collectible card plus useful sharing controls. */

.kp-tags { gap: 6px; margin: 0 0 24px; }

.kp-axis > div:first-child:not(.kp-axis-track), .kp-axis-labels { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #a08e77; font-size: 10px; margin-bottom: 6px; }

.kp-axis-caption { color: #b2a28b; font-size: 9px; line-height: 1.8; margin: 11px 0 0; }
.kp-result-description { color: #95836d; font-size: 11px; line-height: 1.95; margin: 20px 0 0; }
.kp-card-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 17px; margin-top: 23px; border-top: 1px dashed #d8c8b1; color: #ae977d; font-size: 9px; }

.kp-result-actions { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.kp-result-actions > .kp-btn { width: 100%; }
.kp-share-panel { min-width: 0; padding: 20px; background: #fffaf0; border: 1px solid #e3d6be; }

.kp-link-input { display: flex; align-items: stretch; gap: 6px; min-width: 0; margin: 11px 0; }
.kp-link-input input, .kp-link-input textarea, .kp-share-url input, .kp-share-url textarea { display: block; width: 100%; min-width: 0; max-width: 100%; border: 1px solid #decfb8; border-radius: 2px; background: #fffefb; color: #9a826b; padding: 10px; outline: none; font: 10px/1.6 var(--kp-mono); text-overflow: ellipsis; }

.kp-qr { display: grid; place-items: center; width: fit-content; max-width: 100%; margin: 15px auto 0; padding: 9px; background: #fff; border: 1px solid #e5d9c3; }

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

   return `<article class="journal-card ${e.template==='receipt'?'receipt-theme':''}"><div class="journal-date"><strong>${parts[1]}.${parts[2]}</strong><small>${weekday} · ${parts[0]}</small></div><div class="journal-photo-wrap" ${full?'':`data-action="open-entry" data-id="${esc(e.id)}" role="button" tabindex="0" aria-label="打开这页日记"`}><span class="tape"></span><img class="journal-photo" src="${esc(photo(e))}" alt="${esc(e.photo?'我上传的用餐照片':D.kinds[e.kind]+'原创示例插画')}"><span class="photo-caption">A LITTLE MOMENT, WELL KEPT.</span></div><h3>${esc(e.title||'今天的小小快乐')}</h3><p class="journal-note">${esc(e.note||'还没写下的话，也可以以后慢慢补。')}</p><div class="journal-tags">${(e.personalItems?.length?e.personalItems:[D.kinds[e.kind]]).slice(0,4).map(v=>`<span>${esc(v)}</span>`).join('')}<span>♡ ${esc(e.mood||'小确幸')}</span></div><div class="journal-meta"><span>${meta(e)}${e.orderSource?.source==='mcp'?' · MCP 订单资料':e.orderId?' · 示例订单关联':''}</span><span class="journal-sign">enjoy the little things</span></div></article>`;
 }
 function heading(eye,title,subtitle,decoration='little joys.'){return `<div class="page-heading"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="heading-decoration">${decoration}</div></div>`;}
 function stats(entries){const days=new Set(entries.map(e=>e.date)).size,photos=entries.filter(e=>e.photo).length;return `<div class="month-summary"><div class="mini-stat"><span class="stat-icon">${icon('calendar')}</span><div><strong>${entries.length}<span class="stat-unit">餐</span></strong><small>本月收录${state.space==='demo'?' · 含示例':''}</small></div></div><div class="mini-stat"><span class="stat-icon">${icon('heart')}</span><div><strong>${days}<span class="stat-unit">天</span></strong><small>留下回忆的日子</small></div></div><div class="mini-stat"><span class="stat-icon">${icon('photo')}</span><div><strong>${photos}<span class="stat-unit">张</span></strong><small>自己的照片</small></div></div></div>`;}
 function calendarHTML(){
   const entries=monthEntries(),first=(new Date(state.year,state.month-1,1).getDay()+6)%7,days=new Date(state.year,state.month,0).getDate(),total=Math.ceil((first+days)/7)*7;
   let cells='';for(let i=0;i<total;i++){const d=i-first+1;if(d<1||d>days){cells+='<div class="day-cell blank"></div>';continue;}
     const date=dateKey(state.year,state.month,d),es=entries.filter(e=>e.date===date),e=es[0],tilt=[-10,6,-4,8,-7,4][d%6];
     cells+=`<button class="day-cell ${e?'has-entry':''} ${state.date===date?'selected':''} ${date===today?'is-today':''}" data-action="day" data-date="${date}" aria-label="${state.month}月${d}日，${es.length}条记录" aria-pressed="${state.date===date}"><span class="day-number">${d}</span>${e?`<img class="${e.photo?'day-photo':'day-sticker'}" src="${esc(src(e))}" alt="" style="--tilt:${tilt}deg;--i:${d%9}">${es.length>1?`<small class="day-extra">+${es.length-1}</small>`:''}`:''}</button>`;
   }
   return heading(`${months[state.month-1]} ${state.year} · A DIARY OF LITTLE BITES`,`${zhMonths[state.month-1]}，把小日子<em>收好。</em>`,'一张照片，一口喜欢。普通的一餐，也值得记下来。')+`<div class="content-grid"><section class="calendar-column"><div class="calendar-panel"><div class="calendar-toolbar"><div class="month-name"><strong>${state.month}月</strong><small>${state.year}</small></div><div class="month-controls"><button class="icon-btn" data-action="prev-month" aria-label="上一个月">${icon('left')}</button><button class="today-btn" data-action="today">今天</button><button class="icon-btn" data-action="next-month" aria-label="下一个月">${icon('right')}</button></div></div><div class="weekdays">${['一','二','三','四','五','六','日'].map(s=>`<span>${s}</span>`).join('')}</div><div class="calendar-grid entering">${cells}</div><div class="calendar-bottom"><span><i class="legend-dot"></i>点开一天，翻一页回忆</span><b>${new Set(entries.map(e=>e.date)).size} 个有记录的日子</b></div></div><div class="calendar-under"><span class="under-star">✳</span><div><p>今天，有什么小事值得留住？</p><small>选一张照片，剩下的交给这一页。</small></div><button class="text-btn" data-action="new">记一餐 ↗</button></div>${stats(entries)}</section><aside class="day-preview" id="day-preview">${previewHTML()}</aside></div>`;
 }
 function previewHTML(){const es=dayEntries();if(!es.length)return `<div class="preview-label"><span>${+state.date.slice(5,7)} 月 ${+state.date.slice(8)} 日</span><span>YOUR NEXT PAGE</span></div><div class="preview-empty"><img class="empty-art" src="${art('coffee')}" alt=""><p>这一页，等你来写。</p><small>没有记录的日子，也可以慢慢补。</small><button class="primary-btn small" data-action="new">${icon('plus')}留下这一餐</button></div>`;
   state.dayIndex=Math.min(state.dayIndex,es.length-1);const e=es[state.dayIndex];
   return `<div class="preview-label"><span>${state.date===today?'今天':'这一日'}的小小记忆</span><span>PAGE ${String(all().indexOf(e)+1).padStart(2,'0')}</span></div><div class="journal-pop">${journalMarkup(e)}</div>${es.length>1?`<div class="day-switch">${es.map((item,i)=>`<button class="${i===state.dayIndex?'active':''}" data-action="day-index" data-index="${i}" aria-label="查看当天第${i+1}餐"></button>`).join('')}</div>`:''}<div class="preview-actions"><button data-action="edit" data-id="${esc(e.id)}">${icon('edit')}编辑这一页</button><button data-action="export" data-id="${esc(e.id)}">${icon('download')}保存图片</button></div>`;
 }
 function collectionHTML(){const entries=monthEntries(),amounts=entries.filter(e=>e.amount!=null),total=amounts.reduce((s,e)=>s+Math.round(e.amount*100),0)/100;return heading(`${months[state.month-1]} ${state.year} · THE LITTLE COLLECTION`,'把喜欢的，<em>都装进来。</em>','每一枚贴纸，都是一个真实或想象中的小小瞬间。','a pocket of joy.')+`<div class="collection-layout"><section class="collection-board"><div class="collection-board-head"><h2>${state.month} 月的快乐碎片</h2><small>${entries.length} 个小瞬间</small></div><div id="sticker-box" class="sticker-box" aria-label="可以拖动的食物贴纸盒"></div><div class="collection-caption"><p>${entries.length?'拖一拖，晃一晃。点贴纸可以打开日记。':'还没有贴纸。先记下一餐吧。'}</p><button class="shake-btn" data-action="shake" ${!entries.length?'disabled':''}>↝ 轻轻晃一下</button></div></section><aside class="collection-right"><div class="recap-invitation"><div class="eyebrow">YOUR MONTH, IN MOTION</div><h2>把这个月，<br>再过一遍。</h2><p>让每一个小瞬间，依次走过眼前。</p><img class="recap-art" src="${art('fries')}" alt=""><button data-action="reel" ${!entries.length?'disabled':''}>▶ 播放贴纸回顾</button></div><div class="collection-facts"><div class="fact-row"><span>收录的日记</span><b>${entries.length} 页</b></div><div class="fact-row"><span>自己的照片</span><b>${entries.filter(e=>e.photo).length} 张</b></div><div class="fact-row"><span>${state.space==='demo'?'示例与已填金额':'已填个人花费'}</span><b>¥ ${total.toFixed(2)}</b></div><div class="fact-row"><span>金额记录覆盖</span><b>${amounts.length} / ${entries.length} 页</b></div></div></aside></div><div class="collection-bottom"><div class="collection-bottom-head"><h3>这一月，一页一页。</h3><button class="text-btn" data-action="export-month" ${!entries.length?'disabled':''}>保存照片月历 ↗</button></div><div class="collection-strip">${entries.map(e=>`<button class="strip-entry" data-action="open-entry" data-id="${esc(e.id)}"><img class="${e.photo?'is-photo':''}" src="${esc(src(e))}" alt=""><strong>${e.date.slice(5).replace('-',' / ')}</strong><small>${esc(e.title)}</small></button>`).join('')||'<p class="subtitle">第一枚贴纸，留给今天。</p>'}</div></div>`;}
 function yearHTML(){const entries=all().filter(e=>e.date.startsWith(state.year+'-'));return heading('A YEAR OF ORDINARY WONDERS','慢慢吃，<em>慢慢收藏。</em>',`${state.year} 年已留下 ${entries.length} 页。不是完整账单，是你愿意记住的小日子。`,'turn the page.')+`<div class="calendar-toolbar"><div class="year-controls"><button class="icon-btn" data-action="prev-year" aria-label="上一年">${icon('left')}</button><b>${state.year}</b><button class="icon-btn" data-action="next-year" aria-label="下一年">${icon('right')}</button></div><span class="subtitle">点开月份，翻回那一页</span></div><div class="year-grid">${months.map((m,i)=>{const es=entries.filter(e=>+e.date.slice(5,7)===i+1),e=es[es.length-1];return `<button class="month-book ${e?'':'book-empty'}" data-action="book" data-month="${i+1}" aria-label="${i+1}月，${es.length}条记录"><div class="book-cover" ${e?`style="background:${['#eadbc1','#dfe2cc','#ead8ce','#deded0'][i%4]}"`:''}><div class="book-month"><strong>${pads(i+1)}</strong><small>${m.toUpperCase().slice(0,3)}</small></div>${e?`<img class="book-art ${e.photo?'book-photo':''}" src="${esc(src(e))}" alt="">`:'<span class="empty-book-star">✳</span>'}<div class="book-caption">${e?'LITTLE BITES, LOVELY DAYS':'A PAGE WAITING FOR YOU'}</div></div><div class="book-label"><b>${zhMonths[i]}</b><span>${es.length?es.length+' 页小日子':'留白也很好'}</span></div></button>`;}).join('')}</div>`;}
 function render(){window.KeepsPersonaUI?.unmount();if(boxCleanup){boxCleanup();boxCleanup=null;}const host=$('#view-host');host.innerHTML=state.view==='persona'?'':state.view==='calendar'?calendarHTML():state.view==='collection'?collectionHTML():yearHTML();if(state.view==='persona')KeepsPersonaUI.mount(host,{entries:monthEntries(),space:state.space,year:state.year,month:state.month,onJournal:startPersonaJournal,onNavigate:setView,toast,motionOff:state.motionOff});else if(state.view==='calendar')host.querySelector('.page-heading').insertAdjacentHTML('afterend',KeepsPersonaUI.banner());host.classList.remove('view-enter');if(!state.motionOff){void host.offsetWidth;host.classList.add('view-enter');}document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false');});$('#view-crumb').textContent={calendar:'照片日历',collection:'本月收藏',year:'年度书架',persona:'快乐人格'}[state.view];$('#space-btn').children[1].textContent=state.space==='demo'?'示例手帐':'我的手帐';if(state.view==='collection'){boxCleanup=KeepsMotion.mount($('#sticker-box'),{items:monthEntries().slice(-18).map(e=>({id:e.id,src:src(e),label:e.title})),onSelect:openEntry,reducedMotion:state.motionOff});}fillIcons();}
 function setView(view){state.view=['calendar','collection','year','persona'].includes(view)?view:'calendar';const target=state.view==='persona'&&/^#persona(?:\?|$)/.test(location.hash)?location.hash:'#'+state.view;if(location.hash!==target)history.pushState(null,'',target);render();window.scrollTo({top:0,behavior:state.motionOff?'auto':'smooth'});}
 function changeMonth(delta){let d=new Date(state.year,state.month-1+delta,1);state.year=d.getFullYear();state.month=d.getMonth()+1;state.date=dateKey(state.year,state.month,1);state.dayIndex=0;render();}
 $('#view-host').addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
   if(action==='persona')setView('persona');if(action==='day'){state.date=el.dataset.date;state.dayIndex=0;document.querySelectorAll('.day-cell').forEach(b=>{b.classList.toggle('selected',b.dataset.date===state.date);b.setAttribute('aria-pressed',String(b.dataset.date===state.date));});$('#day-preview').innerHTML=previewHTML();if(innerWidth<=720)$('#day-preview').scrollIntoView({behavior:state.motionOff?'auto':'smooth',block:'start'});}
   if(action==='day-index'){state.dayIndex=+el.dataset.index;$('#day-preview').innerHTML=previewHTML();}
   if(action==='prev-month')changeMonth(-1);if(action==='next-month')changeMonth(1);
   if(action==='today'){state.year=now.getFullYear();state.month=now.getMonth()+1;state.date=today;state.dayIndex=0;render();}
   if(action==='new')openEditor();if(action==='edit')openEditor(id);if(action==='open-entry')openEntry(id);if(action==='export')exportEntry(find(id));if(action==='export-month')exportMonth();if(action==='shake')boxCleanup?.shake();if(action==='reel')openReel();
   if(action==='prev-year'||action==='next-year'){state.year+=action==='next-year'?1:-1;render();}
   if(action==='book'){state.month=+el.dataset.month;const es=monthEntries();state.date=es[es.length-1]?.date||dateKey(state.year,state.month,1);state.dayIndex=0;setView('calendar');}
 });
 $('#view-host').addEventListener('keydown',e=>{const p=e.target.closest('.journal-photo-wrap');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();p.click();}});

 function openEntry(id){const e=find(id);if(!e)return;$('#entry-host').innerHTML=`<header class="dialog-header"><div><h2>翻开这一页</h2><p>${esc(e.date)} · ${meta(e)}</p></div><button class="icon-btn" data-close aria-label="关闭日记">${icon('close')}</button></header><div class="entry-full">${journalMarkup(e,true)}</div><div class="entry-dialog-actions"><button class="secondary-btn" id="detail-edit">${icon('edit')}编辑</button><button class="primary-btn" id="detail-export">${icon('download')}保存图片</button><button class="delete-btn" id="detail-delete">删除这页</button></div>`;$('#entry-dialog').showModal();$('#entry-dialog').querySelector('[data-close]').onclick=()=>$('#entry-dialog').close();$('#detail-edit').onclick=()=>{$('#entry-dialog').close();openEditor(id);};$('#detail-export').onclick=()=>exportEntry(e);$('#detail-delete').onclick=async()=>{if(await confirm('删除这一页？','照片和随记会从本机手帐删除。其他页面不受影响。')){try{await persist(state.entries.filter(x=>x.id!==id||x.space!==state.space));$('#entry-dialog').close();render();toast('已删除这一页');}catch{toast('保存失败，原记录还在');}}};}
 function editorPreview(){return journalMarkup({...draft,id:'draft',isExample:!draft.photo},true);}

 function openEditor(id){photoBusy=false;photoRequest++;const original=id?find(id):null;draft=original?JSON.parse(JSON.stringify(original)):{id:'entry-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),space:state.space,date:state.date,kind:'fries',title:'今天的小小快乐',note:'',mood:'小确幸',amount:null,photo:null,template:'polaroid',personalItems:['薯条'],isExample:false,createdAt:new Date().toISOString()};

raft.template==='receipt'?'selected':''}">票根拼贴</button>${draft.photo?'<button id="remove-photo">移除照片</button>':''}</div><button class="order-toggle" id="order-toggle">${draft.orderSource?.source==='mcp'?'已关联 MCP 订单 · 选择本人餐品':draft.orderId?'已关联示例订单 · 查看':'＋ 试试关联示例订单'}</button><div id="order-host" hidden></div></div></div><footer class="editor-footer"><small>${state.space==='demo'?'当前是示例手帐空间':'保存到「我的手帐」'}<br>${draft.orderSource?.source==='mcp'?'MCP 订单资料 · 用餐日期请确认':'示例 / 手动记录 · 日期请确认'}</small><div class="row"><button class="secondary-btn" id="editor-cancel">取消</button><button class="primary-btn" id="editor-save">${icon('check')}收进日历</button></div></footer>`;
  $('#editor-dialog').showModal();$('#editor-host').querySelector('[data-close]').onclick=()=>$('#editor-dialog').close();$('#editor-cancel').onclick=()=>$('#editor-dialog').close();$('#editor-save').onclick=saveEditor;

 async function api(route,args){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Mc-Keeps-CSRF':csrf},body:JSON.stringify(args||{})});const v=await r.json();if(!r.ok)throw new Error(v.error||'读取失败');return v;}
 function status(text){dialog.querySelector('#orders-status').textContent=text;}
 function card(order){const personal=McKeeps.state.entries.filter(e=>e.space==='personal'),exists=personal.find(e=>e.orderId===order.id);return `<article class="live-order" data-live-id="${esc(order.id)}"><h3>${esc(order.date||'日期待确认')} · ${esc(order.status)}</h3><p>${esc(order.storeName||'门店信息未知')} · 整单 ${order.totalMinor===null?'金额未知':'¥'+(order.totalMinor/100).toFixed(2)}</p><p>时间来自下单记录，请在保存前确认实际用餐日。</p><div class="live-products">${order.items.map(p=>`${esc(p.name)}${p.quantity?' × '+p.quantity:''}${p.children.length?'<br><small>　'+p.children.map(c=>esc(c.name)).join(' / ')+'</small>':''}`).join('<br>')||'餐品明细未知，可自行补充'}</div><select aria-label="关联到哪页日记"><option value="">${exists?'打开已有订单日记':'新建一页，稍后加照片'}</option>${personal.map(e=>`<option value="${esc(e.id)}">关联已有照片：${esc(e.date)} ${esc(e.title)}</option>`).join('')}</select><div class="row"><button class="secondary-btn" data-detail>查看订单详情</button><button class="primary-btn" data-use ${!order.completed?'disabled':''}>${exists?'继续编辑这一页':'用这些资料记一餐'}</button></div>${!order.completed?'<p>该状态未确认为已完成，暂不自动生成用餐日记。</p>':''}</article>`;}
 function renderCards(){const list=dialog.querySelector('#orders-list');list.innerHTML=orders.map(card).join('');list.querySelectorAll('[data-live-id]').forEach(el=>{const id=el.dataset.liveId;el.querySelector('[data-detail]').onclick=async e=>{if(busy)return;busy=true;e.target.disabled=true;try{status('正在读取这笔订单详情…');const result=await api('/api/order-detail',{id});orders=orders.map(o=>o.id===id?result.order:o);renderCards();status('详情已更新。配送地址、电话、取餐码和支付资料不会传入页面。');}catch(error){status(error.message);}finally{busy=false;if(e.target.isConnected)e.target.disabled=false;}};el.querySelector('[data-use]').onclick=()=>{const order=orders.find(o=>o.id===id);const target=el.querySelector('select').value;dialog.close();McKeeps.beginOrder(order,target);};});}
 async function open(){dialog.innerHTML=`<header class="dialog-header"><div><h2>把订单，补进回忆里。</h2><p>只读查询 · 照片、随记与用餐日由你确认</p></div><button class="icon-btn" id="orders-close" aria-label="关闭订单连接">${icon('close')}</button></header><div class="orders-body"><p class="orders-explain">先拍的照片可以稍后关联订单。整单金额保留作来源参考，不会自动算成你的个人花费。</p><div id="orders-status" class="orders-status">正在检查本机连接…</div><div class="orders-close-row"><button class="primary-btn small" id="orders-refresh">读取近期订单</button><a class="orders-info" href="https://github.com/17-log/mc-keeps#真实订单连接" target="_blank" rel="noopener">本机安装说明 ↗</a></div><div id="orders-list"></div></div>`;dialog.showModal();dialog.querySelector('#orders-close').onclick=()=>dialog.close();const refresh=dialog.querySelector('#orders-refresh');refresh.disabled=true;
 if(!isLocal){status('当前是公开演示 / 离线版，使用虚构示例。真实订单连接在本机版运行，个人凭据无需交给任何网站。');return;}
 try{const r=await fetch('/api/status');const data=await r.json();csrf=data.csrf;if(!data.configured){status('本机还没有配置 MCP Token。请按安装说明填写 .env.local，配置后重新打开此窗口。');return;}status('本机凭据已配置。点击后只读取当前账号可见的近期订单。');refresh.disabled=false;refresh.onclick=async()=>{if(busy)return;busy=true;refresh.disabled=true;try{status('正在向麦当劳 MCP 读取…');const result=await api('/api/orders');orders=result.orders;renderCards();status(`读取到 ${orders.length} 笔订单。${result.coverage}。个人资料仅在本机处理。`);const badge=document.querySelector('.demo-badge');badge.textContent='MCP 只读已连接';}catch(error){status(error.message);}finally{busy=false;refresh.disabled=false;}};}catch{status('没有连接到本机订单服务。请从安装说明启动本机版。');}}
 button.onclick=open;dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
})();
</script></body></html>
