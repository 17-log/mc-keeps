.km-tray {
  position: relative;
  height: 350px;
  min-height: 300px;
  overflow: hidden;
  isolation: isolate;
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 0, rgba(255,255,255,.8), transparent 72%),
    #f7f0e6;
  border: 1px solid rgba(116, 84, 58, .10);
  box-shadow: inset 0 2px 10px rgba(119, 91, 61, .025);
  -webkit-user-select: none;
  user-select: none;
}
.km-tray-decoration { position: absolute; inset: 0; pointer-events: none; color: #c2a88b; }
.km-tray-star { position: absolute; line-height: 1; opacity: .65; }
.km-tray-star-one { top: 30px; left: 28px; font-size: 22px; transform: rotate(12deg); }
.km-tray-star-two { top: 76px; right: 33px; font-size: 30px; transform: rotate(-9deg); }
.km-tray-word {
  position: absolute; top: 34px; left: 0; right: 0; text-align: center;
  font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-style: italic;
  letter-spacing: .3px; color: #b69d82;
}
.km-sticker {
  position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0;
  display: block; background: none; border-radius: 25%; cursor: grab;
  color: #5c4032; touch-action: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  transform-origin: 50% 50%; outline: none;
}
.km-sticker-art {
  position: relative; display: block; height: 100%; width: 100%;
  transition: scale .18s ease, filter .18s ease;
  filter: drop-shadow(0 1px 0 white) drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 -1px 0 white) drop-shadow(0 5px 3px rgba(77,48,24,.11));
}
.km-sticker img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  pointer-events: none; -webkit-user-drag: none;
}
.km-sticker-label {
  position: absolute; z-index: 5; left: 50%; bottom: -15px; transform: translate(-50%, 3px);
  max-width: 140px; width: max-content; padding: 5px 9px; border-radius: 8px;
  background: #fffdf9; border: 1px solid #e7dacb; box-shadow: 0 3px 10px #60432512;
  color: #665043; font-size: 11px; line-height: 1.4; font-family: inherit;
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.km-sticker:hover .km-sticker-art { scale: 1.045; }
.km-sticker:hover .km-sticker-label,
.km-sticker:focus-visible .km-sticker-label { opacity: 1; transform: translate(-50%, 0); }
.km-sticker:focus-visible { outline: 2px dashed #a95d46; outline-offset: 3px; }
.km-sticker.km-dragging { cursor: grabbing; }
.km-sticker.km-dragging .km-sticker-art {
  scale: 1.075;
  filter: drop-shadow(0 1px 0 white) drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 -1px 0 white) drop-shadow(0 11px 7px rgba(77,48,24,.20));
}
.km-sticker.km-dragging .km-sticker-label { opacity: 0; }
.km-sticker.km-selected .km-sticker-art { animation: km-soft-pop .4s cubic-bezier(.2,.65,.3,1); }
.km-moving .km-sticker { will-change: transform; }
.km-reduced .km-sticker { cursor: pointer; touch-action: manipulation; }
.km-reduced .km-sticker-art { transition: none; }
.km-reduced .km-sticker.km-selected .km-sticker-art { animation: none; }
.km-empty {
  position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
  padding: 35px; font-size: 14px; color: #a08b76; text-align: center;
}
@keyframes km-soft-pop {
  0%,100% { scale: 1; }
  42% { scale: 1.12; }
  72% { scale: .97; }
}
@media (max-width: 600px) {
  .km-tray { height: 320px; border-radius: 20px; }

  .km-tray-star-two { top: 64px; right: 23px; font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .km-sticker-art, .km-sticker-label { transition: none; }
  .km-sticker.km-selected .km-sticker-art { animation: none; }
}

 $('#backup-btn').onclick=()=>{const entries=all(),blob=new Blob([JSON.stringify({format:'mc-keeps',version:1,exportedAt:new Date().toISOString(),space:state.space,entries},null,2)],{type:'application/json'});if(entries.length>500||blob.size>45*1024*1024){toast('超出本版备份容量（500页 / 45MB），暂不生成无法恢复的文件');return;}download(blob,'麦味拾光-完整备份-'+today+'.json');toast('备份已生成，照片和文字都在里面');};
 $('#restore-btn').onclick=()=>$('#restore-input').click();
 $('#restore-input').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>45*1024*1024)throw new Error('备份超过 45 MB，请使用较小备份');const value=JSON.parse(await file.text());if(value.format!=='mc-keeps'||value.version!==1||!Array.isArray(value.entries)||value.entries.length>500)throw new Error('不是支持的麦味拾光备份');const restored=value.entries.map(item=>{if(!item||typeof item.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(item.id)||!D.dateValid(item.date)||!Object.hasOwn(D.kinds,item.kind)||typeof item.title!=='string'||typeof item.note!=='string'||item.title.length>100||item.note.length>2000||item.photo&&(!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(item.photo)||item.photo.length>8e6)||item.amount!=null&&(!Number.isFinite(item.amount)||item.amount<0||item.amount>100000))throw new Error('备份包含无效的记录，未导入');return {id:item.id,space:state.space,date:item.date,kind:item.kind,title:item.title,note:item.note,mood:typeof item.mood==='string'?item.mood.slice(0,20):'小确幸',amount:item.amount??null,photo:item.photo||null,template:item.template==='receipt'?'receipt':'polaroid',personalItems:Array.isArray(item.personalItems)?item.personalItems.filter(v=>typeof v==='string').map(v=>v.slice(0,60)).slice(0,20):[D.kinds[item.kind]],orderId:D.orders.some(o=>o.id===item.orderId)?item.orderId:item.orderSource?.source==='mcp'&&/^mcp-[a-f0-9]{28}$/.test(item.orderId||'')?item.orderId:undefined,orderSource:item.orderSource?.source==='mcp'&&/^mcp-[a-f0-9]{28}$/.test(item.orderId||'')?{source:'mcp',status:String(item.orderSource.status||'未知').slice(0,80),storeName:String(item.orderSource.storeName||'').slice(0,160),totalMinor:Number.isSafeInteger(item.orderSource.totalMinor)&&item.orderSource.totalMinor>=0?item.orderSource.totalMinor:null,date:D.dateValid(item.orderSource.date)?item.orderSource.date:null,items:Array.isArray(item.orderSource.items)?item.orderSource.items.slice(0,100).filter(p=>p&&typeof p.name==='string').map(p=>({name:p.name.slice(0,160),quantity:Number.isSafeInteger(p.quantity)?p.quantity:null})):[]}:undefined,isExample:!!item.isExample,createdAt:typeof item.createdAt==='string'?item.createdAt:new Date().toISOString()};});const existing=new Set(all().map(v=>v.id)),unique=new Map();restored.forEach(v=>{if(!existing.has(v.id))unique.set(v.id,v);});const imported=[...unique.values()];if(!await confirm('恢复这份备份？',`将向当前空间加入 ${imported.length} 页，跳过 ${restored.length-imported.length} 页重复记录。已有内容保留。`))return;await persist([...state.entries,...imported]);render();toast(`已恢复 ${imported.length} 页，照片和文字都在`);}catch(error){toast(error.message||'恢复失败，已有日记没有改变');}};
 window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['calendar','collection','year'].includes(v)&&v!==state.view){state.view=v;render();}});
 async function boot(){try{const stored=await D.read();state.entries=Array.isArray(stored)?stored:D.seedEntries();if(!stored)await D.write(state.entries);}catch{storageAvailable=false;state.entries=D.seedEntries();toast('浏览器不允许本地存储，当前只能预览示例');}try{state.space=localStorage.getItem('mc-keeps-space')==='personal'?'personal':'demo';}catch{}state.view=['calendar','collection','year'].includes(location.hash.slice(1))?location.hash.slice(1):'calendar';document.documentElement.classList.toggle('motion-off',state.motionOff);render();fillIcons();window.McKeeps={state,render,openEditor,openEntry,exportEntry,exportMonth,beginOrder};}
 boot();
})();

(()=>{
 'use strict';
 const esc=KeepsData.esc,icon=KeepsData.icon;
 const button=document.createElement('button');button.className='orders-button';button.id='live-orders-button';button.textContent='订单连接';document.querySelector('.top-actions').insertBefore(button,document.querySelector('#motion-toggle'));
 const dialog=document.createElement('dialog');dialog.className='orders-dialog';dialog.id='live-orders-dialog';document.body.appendChild(dialog);
 let csrf='',orders=[],busy=false;
 const isLocal=location.hostname==='127.0.0.1'&&location.port==='4880';
 async function api(route,args){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Mc-Keeps-CSRF':csrf},body:JSON.stringify(args||{})});const v=await r.json();if(!r.ok)throw new Error(v.error||'读取失败');return v;}
 function status(text){dialog.querySelector('#orders-status').textContent=text;}
 function card(order){const personal=McKeeps.state.entries.filter(e=>e.space==='personal'),exists=personal.find(e=>e.orderId===order.id);return `<article class="live-order" data-live-id="${esc(order.id)}"><h3>${esc(order.date||'日期待确认')} · ${esc(order.status)}</h3><p>${esc(order.storeName||'门店信息未知')} · 整单 ${order.totalMinor===null?'金额未知':'¥'+(order.totalMinor/100).toFixed(2)}</p><p>时间来自下单记录，请在保存前确认实际用餐日。</p><div class="live-products">${order.items.map(p=>`${esc(p.name)}${p.quantity?' × '+p.quantity:''}${p.children.length?'<br><small>　'+p.children.map(c=>esc(c.name)).join(' / ')+'</small>':''}`).join('<br>')||'餐品明细未知，可自行补充'}</div><select aria-label="关联到哪页日记"><option value="">${exists?'打开已有订单日记':'新建一页，稍后加照片'}</option>${personal.map(e=>`<option value="${esc(e.id)}">关联已有照片：${esc(e.date)} ${esc(e.title)}</option>`).join('')}</select><div class="row"><button class="secondary-btn" data-detail>查看订单详情</button><button class="primary-btn" data-use ${!order.completed?'disabled':''}>${exists?'继续编辑这一页':'用这些资料记一餐'}</button></div>${!order.completed?'<p>该状态未确认为已完成，暂不自动生成用餐日记。</p>':''}</article>`;}
 function renderCards(){const list=dialog.querySelector('#orders-list');list.innerHTML=orders.map(card).join('');list.querySelectorAll('[data-live-id]').forEach(el=>{const id=el.dataset.liveId;el.querySelector('[data-detail]').onclick=async e=>{if(busy)return;busy=true;e.target.disabled=true;try{status('正在读取这笔订单详情…');const result=await api('/api/order-detail',{id});orders=orders.map(o=>o.id===id?result.order:o);renderCards();status('详情已更新。配送地址、电话、取餐码和支付资料不会传入页面。');}catch(error){status(error.message);}finally{busy=false;if(e.target.isConnected)e.target.disabled=false;}};el.querySelector('[data-use]').onclick=()=>{const order=orders.find(o=>o.id===id);const target=el.querySelector('select').value;dialog.close();McKeeps.beginOrder(order,target);};});}
 async function open(){dialog.innerHTML=`<header class="dialog-header"><div><h2>把订单，补进回忆里。</h2><p>只读查询 · 照片、随记与用餐日由你确认</p></div><button class="icon-btn" id="orders-close" aria-label="关闭订单连接">${icon('close')}</button></header><div class="orders-body"><p class="orders-explain">先拍的照片可以稍后关联订单。整单金额保留作来源参考，不会自动算成你的个人花费。</p><div id="orders-status" class="orders-status">正在检查本机连接…</div><div class="orders-close-row"><button class="primary-btn small" id="orders-refresh">读取近期订单</button><a class="orders-info" href="https://github.com/17-log/mc-keeps#真实订单连接" target="_blank" rel="noopener">本机安装说明 ↗</a></div><div id="orders-list"></div></div>`;dialog.showModal();dialog.querySelector('#orders-close').onclick=()=>dialog.close();const refresh=dialog.querySelector('#orders-refresh');refresh.disabled=true;
 if(!isLocal){status('当前是公开演示 / 离线版，使用虚构示例。真实订单连接在本机版运行，个人凭据无需交给任何网站。');return;}
 try{const r=await fetch('/api/status');const data=await r.json();csrf=data.csrf;if(!data.configured){status('本机还没有配置 MCP Token。请按安装说明填写 .env.local，配置后重新打开此窗口。');return;}status('本机凭据已配置。点击后只读取当前账号可见的近期订单。');refresh.disabled=false;refresh.onclick=async()=>{if(busy)return;busy=true;refresh.disabled=true;try{status('正在向麦当劳 MCP 读取…');const result=await api('/api/orders');orders=result.orders;renderCards();status(`读取到 ${orders.length} 笔订单。${result.coverage}。个人资料仅在本机处理。`);const badge=document.querySelector('.demo-badge');badge.textContent='MCP 只读已连接';}catch(error){status(error.message);}finally{busy=false;refresh.disabled=false;}};}catch{status('没有连接到本机订单服务。请从安装说明启动本机版。');}}
 button.onclick=open;dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
})();
</script></body></html>
